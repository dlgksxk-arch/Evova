<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Core -->

    <meta name="description" content="Try clothes online instantly with HAMDEVA. Upload your photo and preview outfits, traditional clothing, and fashion styles in seconds. No signup required." />

    <!-- Favicon -->

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "HAMDEVA",
      "url": "https://hamdeva.com/",

    }

  </head>
