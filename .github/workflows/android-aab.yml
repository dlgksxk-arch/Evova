name: Android AAB

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Release name shown in the artifact name
        required: true
        default: 0.1.0-internal
      version_name:
        description: Android versionName
        required: true
        default: 0.1.0
      version_code:
        description: Android versionCode
        required: true
        default: "1"

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run cap:sync

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -PversionName=${{ inputs.version_name }} \
            -PversionCode=${{ inputs.version_code }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamdeva-${{ inputs.release_name }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
