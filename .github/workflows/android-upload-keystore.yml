name: Android Upload Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate upload keystore
        id: keystore
        shell: bash
        run: |
          mkdir -p out

          KEY_ALIAS="upload"
          KEYSTORE_PASSWORD="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)"
          KEY_PASSWORD="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)"
          KEYSTORE_PATH="out/hamdeva-upload-key.jks"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=HAMDEVA, OU=Mobile, O=HAMDEVA, L=Seoul, ST=Seoul, C=KR"

          KEYSTORE_BASE64="$(base64 -w 0 "$KEYSTORE_PATH")"

          cat > out/github-actions-secrets.txt <<EOF
          ANDROID_KEYSTORE_BASE64=$KEYSTORE_BASE64
          ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          ANDROID_KEY_ALIAS=$KEY_ALIAS
          ANDROID_KEY_PASSWORD=$KEY_PASSWORD
          EOF

          {
            echo "key_alias=$KEY_ALIAS"
            echo "keystore_password=$KEYSTORE_PASSWORD"
            echo "key_password=$KEY_PASSWORD"
          } >> "$GITHUB_OUTPUT"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamdeva-upload-keystore
          path: |
            out/hamdeva-upload-key.jks
            out/github-actions-secrets.txt
          if-no-files-found: error

      - name: Job summary
        run: |
          {
            echo "## Android upload keystore created"
            echo ""
            echo "Artifact name: \`hamdeva-upload-keystore\`"
            echo ""
            echo "Download the artifact and copy the values from \`github-actions-secrets.txt\` into these GitHub Secrets:"
            echo ""
            echo "- \`ANDROID_KEYSTORE_BASE64\`"
            echo "- \`ANDROID_KEYSTORE_PASSWORD\`"
            echo "- \`ANDROID_KEY_ALIAS\`"
            echo "- \`ANDROID_KEY_PASSWORD\`"
            echo ""
            echo "Keep both files safe. You need the same upload key for future Android updates."
          } >> "$GITHUB_STEP_SUMMARY"
